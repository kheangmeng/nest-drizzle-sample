name: Bare Metal CI/CD to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Build NestJS App
        run: npm run build

      # We upload the compiled output so the CD job can use it
      # This prevents us from having to run TypeScript on the small GCP server
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            dist/
            package.json
            package-lock.json
            drizzle/
            drizzle.config.ts

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd:
    name: Deploy to GCP via PM2
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./app-deploy

      # Secure Copy Protocol (SCP) transfers the files to the VPS
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "./app-deploy/*"
          target: "~/nest-app"
          strip_components: 1

      # Connect via SSH to run installation and start the app
      - name: Execute Deployment Scripts via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/nest-app
            
            # 1. Inject Secrets into the server
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            echo "${{ secrets.FIREBASE_SDK_CONTENT }}" > firebase-adminsdk.json

            # 2. Install ONLY production dependencies (ignores devDependencies)
            npm ci --omit=dev

            # 3. Apply any database schema changes
            npm run db:push

            # 4. Start or Restart the app with PM2
            pm2 describe nest-api > /dev/null
            if [ $? -eq 0 ]; then
              echo "App is already running. Restarting..."
              pm2 restart nest-api
            else
              echo "App is not running. Starting..."
              pm2 start dist/main.js --name "nest-api"
            fi
            
            # Save the PM2 list so it automatically restarts if the VPS reboots
            pm2 save