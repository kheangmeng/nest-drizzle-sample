name: CI/CD (Server-Side Build)

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci:
    name: Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 

      - name: Run Unit Tests
        run: npm run test

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT & SERVER BUILD
  # ==========================================
  cd:
    name: Build & Deploy on Server
    needs: ci # Waits for the 'ci' job to pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compress source code
        # Packages all files EXCEPT .git and node_modules into a single archive
        run: tar -czvf app-source.tar.gz --exclude=.git --exclude=node_modules --exclude=app-source.tar.gz .

      - name: Upload Source Archive via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "app-source.tar.gz"
          target: "~/" # Uploads to the home directory temporarily

      - name: Execute Build and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # 1. Create app directory and extract the source code
            mkdir -p ~/nest-app
            tar -xzvf ~/app-source.tar.gz -C ~/nest-app
            
            # 2. Clean up the archive to save disk space
            rm ~/app-source.tar.gz
            
            # Navigate into the app
            cd ~/nest-app
            
            # 3. Inject Secrets
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            echo "${{ secrets.FIREBASE_SDK_CONTENT }}" > firebase-adminsdk.json

            # 4. Install ALL dependencies 
            # (We cannot use --omit=dev here because NestJS requires the TypeScript compiler to build)
            npm install

            # 5. Build the project natively on the VPS
            npm run build

            # 6. Apply database migrations
            npm run db:push

            # 7. Start or Restart with PM2
            pm2 describe nest-api > /dev/null
            if [ $? -eq 0 ]; then
              echo "App is already running. Restarting..."
              pm2 restart nest-api
            else
              echo "App is not running. Starting..."
              pm2 start dist/main.js --name "nest-api"
            fi
            
            # Save the PM2 list so it automatically restarts if the VPS reboots
            pm2 save